# Local infrastructure for development: Postgres (what Steno is told and did) and
# Neo4j (what Steno knows). Run from the repo root with `make up`.
name: steno

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: steno
      POSTGRES_PASSWORD: steno
      POSTGRES_DB: steno
    ports: ["5434:5432"]   # 5434 on the host, so it can run next to other local Postgres containers
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steno"]
      interval: 5s
      retries: 10

  neo4j:
    # Community edition for the POC. Edition and licensing are still Open (DESIGN_DOC §21).
    image: neo4j:2026.09-community
    environment:
      NEO4J_AUTH: neo4j/steno-dev-password
      # A repository's graph is written in one transaction (a failed write changes nothing), so
      # Neo4j must hold all of it: ThingsBoard (116k nodes, 247k edges) needs about 3.5 GB of
      # transaction memory. `make up` sets the heap from this machine's memory (NEO4J_HEAP_MB,
      # 40% of it); it starts small and grows only when a write needs it. Keep Neo4j's default
      # transaction limit (70% of the heap): without one, a write that outgrows the heap
      # crashes the database mid-commit (it must be restarted) instead of failing cleanly.
      # See docs/how-it-works/ingestion/large-repositories.md §8a.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MB:-2048}m
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # browser: http://localhost:7474
      - "7687:7687"   # bolt
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p steno-dev-password 'RETURN 1' >/dev/null"]
      interval: 5s
      retries: 20

volumes:
  postgres-data:
  neo4j-data:
