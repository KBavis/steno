# Used by the `alembic` CLI (e.g. `uv run alembic revision --autogenerate -m "..."`).
# `steno db upgrade` configures Alembic in code and doesn't need this file.
# The database URL comes from STENO_DATABASE_URL (see steno/config.py).
[alembic]
script_location = %(here)s/src/steno/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
