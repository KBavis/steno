name: steno-pack-sqlalchemy
version: 0.1.0
language: python
source: core
description: SQLAlchemy models, the tables they map to, and the queries that read and write them
# The library versions these rules are written and tested for (coverage reports others)
versions:
  sqlalchemy: ">=1.4, <3"
enabled_when:
  dependencies: [sqlalchemy]
  imports: [sqlalchemy]
library:
  # Transaction and session housekeeping: not a read or a write of their own
  harmless:
    - sqlalchemy.orm.Session.commit
    - sqlalchemy.orm.Session.flush
    - sqlalchemy.orm.Session.refresh
    - sqlalchemy.orm.Session.rollback
    - sqlalchemy.orm.Session.close
    - sqlalchemy.ext.asyncio.AsyncSession.commit
    - sqlalchemy.ext.asyncio.AsyncSession.flush
    - sqlalchemy.ext.asyncio.AsyncSession.refresh
    - sqlalchemy.ext.asyncio.AsyncSession.rollback
    - sqlalchemy.ext.asyncio.AsyncSession.close
    - sqlalchemy.orm.DeclarativeBase
    - sqlalchemy.orm.declarative_base
    - sqlalchemy.select
    - sqlalchemy.update
    - sqlalchemy.delete
    - sqlalchemy.insert
  # Building engines, sessions, and statements, and shutting them down: the database a URL names
  # is the sqlalchemy-engine rule's fact, and the reads and writes are the session's
    - sqlalchemy.orm.sessionmaker
    - sqlalchemy.ext.asyncio.async_sessionmaker
    - sqlalchemy.engine.Engine.dispose
    - sqlalchemy.Engine.dispose
    - sqlalchemy.ext.asyncio.AsyncEngine.dispose
    - sqlalchemy.engine.Engine.connect
    - sqlalchemy.Engine.connect
    - sqlalchemy.orm.Session.expire_all
    - sqlalchemy.orm.mapped_column
    - sqlalchemy.text
