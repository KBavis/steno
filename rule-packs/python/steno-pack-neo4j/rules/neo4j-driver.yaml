id: neo4j-driver
description: The application's Neo4j database, from the URI its driver is created with, e.g. GraphDatabase.driver("neo4j://graph.internal:7687", auth=(user, password)) - credentials dropped. Whether a query reads or writes depends on its Cypher, which this rule doesn't read.
match:
  rule:
    kind: call
    all:
      - has:
          field: function
          regex: "^(neo4j\\.)?(GraphDatabase|AsyncGraphDatabase)\\.driver$"
      - has:
          field: arguments
          has:
            nthChild: 1
            pattern: $URI
            not: { kind: keyword_argument }
      - inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any:
              - kind: import_from_statement
                has: { field: module_name, regex: "^neo4j$" }
              - kind: import_statement
                regex: "import neo4j"
emit:
  - node: [DataStore, Graph]
    url: $URI
    vendor: neo4j          # bolt:// and neo4j:// URIs name the protocol, not the vendor
