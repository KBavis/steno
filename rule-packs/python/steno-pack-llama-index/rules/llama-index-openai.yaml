id: llama-index-openai
description: An OpenAI LLM client, e.g. OpenAI(model=self.model_name, api_key=settings.OPENAI_API_KEY)
match:
  rule:
    pattern: $CLS($$$)
  constraints:
    CLS: { regex: "^OpenAI$" }   # AzureOpenAI and OpenAILike subclass OpenAI; they have their own rules
where:
  $CLS: { class: [llama_index.llms.openai.OpenAI] }
emit:
  - clue: client
    type: $CLS
    extends:                     # library bases it inherits: a call on any of these may run here
      - llama_index.core.llms.function_calling.FunctionCallingLLM
      - llama_index.core.llms.FunctionCallingLLM
      - llama_index.core.llms.llm.LLM
      - llama_index.core.llms.LLM
      - llama_index.core.base.llms.base.BaseLLM
    target: { ExternalSystem: { host: api.openai.com, name: OpenAI } }
