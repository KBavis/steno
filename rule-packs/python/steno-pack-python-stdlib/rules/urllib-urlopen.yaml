id: urllib-urlopen
description: An HTTP request made with the standard library, e.g. urlopen(Request(url, headers=headers)) or urllib.request.urlopen("https://api.example.com/v1/items") - GET unless the Request names a method
match:
  rule:
    kind: call
    all:
      - has:
          field: function
          regex: "^(urllib\\.request\\.)?urlopen$"
      - has:
          field: arguments
          has:
            nthChild: 1
            any:
              - pattern: Request($URL $$$)
              - pattern: urllib.request.Request($URL $$$)
              - pattern: $URL
                not: { any: [ { pattern: Request($$$) }, { pattern: urllib.request.Request($$$) } ] }
      - inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any:
              - kind: import_from_statement
                has: { field: module_name, regex: "^urllib\\.request$" }
              - kind: import_statement
                regex: "import urllib"
emit:
  - edge: CALLS
    from: "@function"
    to: { http: { url: $URL } }
