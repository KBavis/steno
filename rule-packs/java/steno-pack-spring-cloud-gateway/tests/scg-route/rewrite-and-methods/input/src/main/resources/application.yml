spring:
  application:
    name: edge
  cloud:
    gateway:
      routes:
        - id: orders
          uri: http://orders:8080
          predicates:
            - Path=/shop/orders/**,/shop/order-history/**
            - Method=GET,POST
          filters:
            - RewritePath=/shop/(?<segment>.*), /${segment}
            - PrefixPath=/v1
