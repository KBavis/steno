name: steno-pack-jpa
version: 0.2.0
language: java
source: core
description: JPA entities and the tables they map to (@Entity, @Table, Spring Boot's default snake_case names)
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies:
    - org.springframework.boot:spring-boot-starter-data-jpa
    - jakarta.persistence:jakarta.persistence-api
    - javax.persistence:javax.persistence-api
    - org.hibernate.orm:hibernate-core
    - org.hibernate:hibernate-core
  imports: [jakarta.persistence, javax.persistence]
library:
  # Mapping annotations: the entity rules read what matters (entity → table)
  harmless: [jakarta.persistence, javax.persistence, org.hibernate.annotations]
