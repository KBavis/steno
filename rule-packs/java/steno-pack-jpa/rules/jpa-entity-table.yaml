id: jpa-entity-table
description: An entity with an explicit table name, e.g. @Entity @Table(name = "budgetUser", schema = "budget") class User - the physical table is budget_user, because Spring Boot's default naming strategy turns camelCase into snake_case, explicit names included
match:
  rule:
    kind: class_declaration
    has:
      kind: modifiers
      all:
        - has: { regex: "^@Entity\\b" }
        - has:
            kind: annotation
            all:
              - has: { field: name, regex: "^Table$" }
              - has:
                  field: arguments
                  has:
                    kind: element_value_pair
                    all:
                      - has: { field: key, regex: "^name$" }
                      - has: { field: value, kind: string_literal, has: { kind: string_fragment, pattern: $GIVEN } }
              # An optional schema (the first branch that matches wins)
              - any:
                  - has:
                      field: arguments
                      has:
                        kind: element_value_pair
                        all:
                          - has: { field: key, regex: "^schema$" }
                          - has: { field: value, pattern: $SCHEMA }
                  - kind: annotation
  transform:
    TABLE: { convert: { source: $GIVEN, toCase: snakeCase } }
emit:
  - node: Entity
    as: entity
    name: "@class"
  - node: Table
    as: table
    name: $TABLE             # Spring Boot's physical name (spring.jpa.hibernate.naming.physical-strategy can change it)
    schema: $SCHEMA
  - edge: MAPS_TO
    from: entity
    to: table
