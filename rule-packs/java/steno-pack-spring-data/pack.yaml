name: steno-pack-spring-data
version: 0.1.0
language: java
source: core
description: Spring Data repositories (reads and writes on their entity's table), MongoDB documents, and Spring Data JDBC / R2DBC tables
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies:
    - org.springframework.boot:spring-boot-starter-data-jpa
    - org.springframework.boot:spring-boot-starter-data-mongodb
    - org.springframework.boot:spring-boot-starter-data-mongodb-reactive
    - org.springframework.boot:spring-boot-starter-data-jdbc
    - org.springframework.boot:spring-boot-starter-data-r2dbc
    - org.springframework.data:spring-data-commons
  imports: [org.springframework.data]
library:
  # Repository interfaces: their reads and writes are found where they're called
  harmless:
    - org.springframework.data.repository
    - org.springframework.data.jpa.repository.JpaRepository
    - org.springframework.data.jpa.repository.JpaSpecificationExecutor
    - org.springframework.data.jpa.repository.Query
    - org.springframework.data.jpa.repository.Modifying
    - org.springframework.data.mongodb.repository
    - org.springframework.data.annotation
    - org.springframework.data.jpa.repository.JpaRepository#flush
