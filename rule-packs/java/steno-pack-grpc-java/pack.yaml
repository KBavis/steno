name: steno-pack-grpc-java
version: 0.1.0
language: java
source: core
description: gRPC services implemented in Java (generated *ImplBase classes)
# The library versions these rules are written and tested for (coverage reports others)
versions:
  io.grpc: ">=1.0, <2"
enabled_when:
  dependencies:
    - io.grpc:grpc-stub
    - io.grpc:grpc-api
    - net.devh:grpc-server-spring-boot-starter
    - org.springframework.grpc:spring-grpc-spring-boot-starter
  imports: [io.grpc]
