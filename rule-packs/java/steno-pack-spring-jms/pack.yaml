name: steno-pack-spring-jms
version: 0.1.0
language: java
source: core
description: Spring JMS listeners and senders (@JmsListener, JmsTemplate)
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies:
    - org.springframework:spring-jms
    - org.springframework.boot:spring-boot-starter-artemis
    - org.springframework.boot:spring-boot-starter-activemq
  imports: [org.springframework.jms]
