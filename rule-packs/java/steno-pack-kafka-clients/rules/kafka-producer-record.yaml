id: kafka-producer-record
description: A record for a topic, e.g. new ProducerRecord<>("orders", key, value) - sent by a KafkaProducer or a KafkaTemplate
match:
  rule:
    kind: object_creation_expression
    has: { field: type, regex: "^ProducerRecord\\b" }
    all:
      - has: { field: arguments, has: { nthChild: 1, pattern: $TOPIC } }
emit:
  - edge: PRODUCES
    from: "@function"
    to: { KafkaTopic: { name: $TOPIC } }
