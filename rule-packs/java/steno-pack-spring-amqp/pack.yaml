name: steno-pack-spring-amqp
version: 0.1.0
language: java
source: core
description: Spring AMQP (RabbitMQ) listeners and senders
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies: [org.springframework.boot:spring-boot-starter-amqp, org.springframework.amqp:spring-rabbit]
  imports: [org.springframework.amqp]
