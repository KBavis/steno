name: steno-pack-spring-boot
version: 0.1.0
language: java
source: core
description: Spring Boot configuration (application.yml / .properties feed ${placeholders}) and scheduled jobs
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies:
    - org.springframework.boot:spring-boot-starter
    - org.springframework.boot:spring-boot-starter-web
    - org.springframework.boot:spring-boot-starter-webflux
    - org.springframework.boot:spring-boot-starter-data-jpa
    - org.springframework.boot:spring-boot
    - org.springframework:spring-context
  imports: [org.springframework.boot, org.springframework.scheduling, org.springframework.context]
library:
  # Wiring and configuration: they never start work or touch a store on their own
  harmless:
    - org.springframework.stereotype
    - org.springframework.context.annotation
    - org.springframework.boot.autoconfigure
    - org.springframework.boot.SpringBootConfiguration
    - org.springframework.boot.context.properties
    - org.springframework.beans.factory.annotation
    - org.springframework.transaction.annotation
    - org.springframework.scheduling.annotation.EnableScheduling
    - org.springframework.scheduling.annotation.EnableAsync
    - org.springframework.scheduling.annotation.Async
    - org.springframework.validation.annotation.Validated
