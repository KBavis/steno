name: steno-pack-spring-cloud-openfeign
version: 0.1.0
language: java
source: core
description: Feign clients (Spring Cloud OpenFeign and plain Feign) - each interface method is an HTTP call
# The library versions these rules are written and tested for (coverage reports others)
versions:
  org.springframework.boot: ">=2.0, <4"
enabled_when:
  dependencies:
    - org.springframework.cloud:spring-cloud-starter-openfeign
    - io.github.openfeign:feign-core
  imports: [org.springframework.cloud.openfeign, feign]
library:
  harmless: [org.springframework.cloud.openfeign.EnableFeignClients, org.springframework.cloud.openfeign.FeignClient]
