name: steno-pack-spring-web
version: 0.2.0
language: java
source: core
description: Spring MVC and WebFlux controllers (endpoints, class-level prefixes), and Spring's HTTP clients (RestTemplate, RestClient, WebClient, @HttpExchange interfaces)
# Auto-enabled when the build file depends on any of these (D25)
enabled_when:
  dependencies:
    - org.springframework.boot:spring-boot-starter-web
    - org.springframework.boot:spring-boot-starter-webflux
    - org.springframework:spring-webmvc
    - org.springframework:spring-webflux
    - org.springframework:spring-web
  imports: [org.springframework.web]
library:
  harmless:
    - org.springframework.web.bind.annotation.ControllerAdvice
    - org.springframework.web.bind.annotation.RestControllerAdvice
    - org.springframework.web.bind.annotation.ExceptionHandler
    - org.springframework.web.bind.annotation.ResponseBody
    - org.springframework.web.bind.annotation.RestController
    - org.springframework.web.bind.annotation.Controller
    - org.springframework.stereotype.Controller
    - org.springframework.web.bind.annotation.ResponseStatus
    - org.springframework.web.bind.annotation.CrossOrigin
    - org.springframework.http
