name: steno-pack-apache-httpclient
version: 0.1.0
language: java
source: core
description: Apache HttpClient 4 and 5 requests (HttpGet, HttpPost, ...)
# HttpClient 5 only: 4.x (org.apache.http) is enabled but has no test case yet
versions:
  org.apache.httpcomponents.client5:httpclient5: ">=5.0, <6"
  org.apache.httpcomponents:httpclient: ">=5"
enabled_when:
  dependencies: [org.apache.httpcomponents:httpclient, org.apache.httpcomponents.client5:httpclient5]
  imports: [org.apache.http, org.apache.hc.client5]
