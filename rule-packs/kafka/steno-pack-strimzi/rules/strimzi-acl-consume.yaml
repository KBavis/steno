id: strimzi-acl-consume
description: A KafkaUser ACL granting Read (or All) on a topic - the user's application may consume it. Prefix ACLs name a family of topics, not one, so they're left out
kind: config
match:
  each: "spec.authorization.acls[*]"
  when:
    "$doc.kind": KafkaUser
    "$.resource.type": topic
    "$.resource.patternType": { not_in: [prefix] }
    "$.operations": { in: [Read, All] }
emit:
  - claim: may_consume
    application: $doc.metadata.name
    channel: { KafkaTopic: $.resource.name }
