# Question set: budgeting-app (POC stage A; docs/plan/roadmap.md §4)
# Questions 1-4 from the owner; 5-10 added. Expected answers are written from the code, not from
# Steno, and are the owner's to correct.
target: budgeting-app
repositories:
  - name: budgeting-app
    clone_url: https://github.com/KBavis/budgeting-app.git
questions:
  - id: ba-01
    use_case: where logic lives
    question: How are transaction categories predicted?
    expected: >
      When transactions are synced (TransactionServiceImpl.syncTransactions → predictCategories),
      the backend sends each one to the Python suggestion engine (SuggestionEngineClient,
      POST {suggestion-engine.base-url}/suggestion). The engine (FastAPI, inference/service.py)
      loads the user's own ONNX model and its preprocessing (joblib) and returns a category id;
      without a model it returns "uncategorized". Models are trained per user by the training
      code (suggestion_engine/training).
    must_mention: [syncTransactions, SuggestionEngineClient, "/suggestion", suggestion engine, ONNX model, per user]
  - id: ba-02
    use_case: data
    question: What's the table that certain categories are tied to that makes them "related"?
    expected: >
      category_type (CategoryType: Needs, Wants, Investments). A category's valid-time rows
      (category_vt) point to it through category_type_id.
    must_mention: [category_type, category_vt, category_type_id]
  - id: ba-03
    use_case: interfaces
    question: Where does financial transaction data for users come from?
    expected: >
      Plaid: the backend calls Plaid's /transactions/sync (PlaidClient) when transactions are
      synced, after a bank is linked (/link/token/create, /item/public_token/exchange). Venmo
      payments are also read from inbound emails (Mailgun webhook, VenmoWebhookController →
      staged_venmo_payment) and matched to transactions. Users can also add transactions by hand.
    must_mention: [Plaid, "/transactions/sync", Venmo, Mailgun webhook]
  - id: ba-04
    use_case: scheduled work
    question: What happens at the end of each month?
    expected: >
      A @Scheduled job (cron "0 55 23 L * ?": 23:55 on the last day of the month,
      ScheduledTasksConfig.generateBudgetPerformance) runs
      BudgetPerformanceService.runGenerateBudgetPerformanceJob: for every user, it computes
      the month's budget overviews (needs, wants, investments, general) and saves them as
      budget performance rows.
    must_mention: ["@Scheduled", last day of the month, generateBudgetPerformance, budget performance]
  - id: ba-05
    use_case: find a flow
    question: What happens when a user connects a bank account?
    expected: >
      The app creates a Plaid link token (POST /link/token/create), the user links in Plaid, and
      the backend exchanges the public token (POST /item/public_token/exchange); the connection
      and its accounts are saved (connection, account tables).
    must_mention: [Plaid, link token, public_token/exchange, connection, account]
  - id: ba-06
    use_case: dependents
    question: What writes to the transaction table?
    expected: >
      Syncing transactions (from Plaid), adding a transaction by hand, splitting, renaming,
      reducing the amount of, assigning or removing a category from, and deleting a transaction:
      TransactionController's endpoints through TransactionServiceImpl; the Venmo email
      matching also updates transactions.
    must_mention: [sync, add, split, TransactionController]
  - id: ba-07
    use_case: interfaces
    question: Which external systems does the backend talk to?
    expected: >
      Plaid (bank links and transactions), its own suggestion engine (category predictions),
      Mailgun (inbound Venmo emails, as a webhook into the backend), and PostgreSQL.
    must_mention: [Plaid, suggestion engine, Mailgun, PostgreSQL]
  - id: ba-08
    use_case: scheduled work
    question: How is the category model trained, and how is training started?
    expected: >
      suggestion_engine/training (train_model.py, classifier.py): reads the users' categorized
      transactions from PostgreSQL (psycopg2), trains a PyTorch classifier, and exports it to
      ONNX with its preprocessing (joblib). It's started by running
      suggestion_engine/scripts/nightly_training.py; nothing in the repository schedules it.
    must_mention: [train_model, PostgreSQL, ONNX, nightly_training.py, not scheduled in the repository]
  - id: ba-09
    use_case: find a flow
    question: What does the Venmo email webhook do?
    expected: >
      POST /api/webhooks/venmo-email (VenmoWebhookController) receives inbound emails from Mailgun,
      parses Venmo payment details (VenmoEmailService) and stages them (staged_venmo_payment);
      on the next sync, pending Venmo transactions are enriched from the staged emails.
    must_mention: [VenmoWebhookController, Mailgun, staged_venmo_payment, sync]
  - id: ba-10
    use_case: dependents
    question: Who reads the monthly budget performance, and how?
    expected: >
      BudgetPerformanceController under /budget/performance: GET (a month), GET /all, POST
      (generate it on demand), and POST /recalculate; called by the frontend.
    must_mention: [BudgetPerformanceController, "/budget/performance", recalculate]
